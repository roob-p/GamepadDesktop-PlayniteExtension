      https://github.com/roob-p/GamepadDesktop-PlayniteExtension/releases/download/v1.0.5/GamepadDesktop_v1.0.5.pext
    Changelog:
      - "Fixed an issue where, if Playnite had no focus (but the script was not yet idle), pressing mouse left via `$tabjump_next could` (`RT` for default) would leave the button stuck."
      - "Added grid.jpg to ensure `GamepadDesktop-Wizard.exe` works correctly."
