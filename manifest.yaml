AddonId: GamepadDesktop
Packages:
  - Version: 1.0.6
    RequiredApiVersion: 6.0.0
    ReleaseDate: 2026-08-09
    PackageUrl: >
      https://github.com/roob-p/GamepadDesktop-PlayniteExtension/releases/download/v1.0.6/GamepadDesktop_v1.0.6.pext
    Changelog:
      - The standard version of the program is now compiled in 64-bit to help to reduce false-positive detections. A 32-bit version is available for manual download if needed.
      - GamepadDesktop now automatically enters idle mode when a game starts. 
      - To prevent GamepadDesktop from entering idle mode for a specific game, add `$GamepadDesktopNoIdle = 1` in "Execute after a game is started script" for that game in Playnite. 
      - Set `$GamepadDesktopNoIdle = 2` if you want GamepadDesktop to enter idle mode 15 seconds after the game starts (this can be useful for games that require some interaction with a launcher before the game is ready.
      - If you previously added the idle mode script to (Global) Scripts → Game scripts → "Execute after a game is started in Playnite", please remove it.
  - Version: 1.0.5
    RequiredApiVersion: 6.0.0
